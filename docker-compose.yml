services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - eve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever is in .env so the app always talks to the `db`
      # service by its Docker network name, regardless of local .env values.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eve_healthcare
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eve_pgdata:
